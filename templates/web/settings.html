<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - {{APP_NAME}}</title>
  <link rel="stylesheet" href="/css/app.css">
  <meta name="shopify-api-key" content="{{API_KEY}}">
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris-1.js"></script>
</head>
<body>
  <s-app-nav>
    <s-link href="/" rel="home">Dashboard</s-link>
    <s-link href="/products">Products</s-link>
    <s-link href="/settings">Settings</s-link>
    <s-link href="/keys">API keys</s-link>
    <s-link href="/polaris">Components</s-link>
    <s-link href="/apis">App Bridge</s-link>
  </s-app-nav>

  <form data-save-bar id="settings-form">
    <s-page heading="Settings" inlineSize="small">
      <s-link slot="breadcrumb-actions" href="/">Dashboard</s-link>

      <!-- Loading state -->
      <s-box id="settings-loading" padding="large-400">
        <s-stack alignItems="center"><s-spinner></s-spinner></s-stack>
      </s-box>

      <!-- Settings sections, hidden until loaded. They stay direct children
           of <s-page>: a wrapper would stop the page spacing them. -->

      <!-- General settings -->
      <s-section heading="General" class="settings-section" style="display:none;">
        <s-text color="subdued">Configure basic app settings.</s-text>
        <s-box paddingBlockStart="base">
          <s-stack gap="base">
            <s-text-field
              id="setting-greeting"
              label="Store greeting message"
              placeholder="Welcome to our store!"
              details="Displayed to customers when they visit your app."
            ></s-text-field>

            <s-select id="setting-theme" label="Theme" details="Choose the visual theme for your app interface.">
              <s-option value="auto">Auto (System)</s-option>
              <s-option value="light">Light</s-option>
              <s-option value="dark">Dark</s-option>
            </s-select>
          </s-stack>
        </s-box>
      </s-section>

      <!-- Notifications -->
      <s-section heading="Notifications" class="settings-section" style="display:none;">
        <s-text color="subdued">Manage email and push notification preferences.</s-text>
        <s-box paddingBlockStart="base">
          <s-stack gap="base">
            <s-switch id="setting-notifications" label="Enable email notifications" details="Receive email alerts for new orders and important events."></s-switch>
            <s-switch id="setting-order-alerts" label="Order alert notifications" details="Get notified when a new order is placed."></s-switch>
          </s-stack>
        </s-box>
      </s-section>

      <!-- Advanced -->
      <s-section heading="Advanced" class="settings-section" style="display:none;">
        <s-text color="subdued">Advanced customization options.</s-text>
        <s-box paddingBlockStart="base">
          <s-text-area
            id="setting-css"
            label="Custom CSS"
            placeholder="/* Add custom styles here */"
            rows="6"
            details="Add custom CSS to override default styles. Must be sanitized server-side before rendering — never inject raw user CSS into pages."
          ></s-text-area>
        </s-box>
      </s-section>

      <!-- Fallback save button (visible outside embedded admin where data-save-bar is unavailable) -->
      <s-section class="settings-section" style="display:none;">
        <s-stack direction="inline" gap="base">
          <s-button variant="primary" onclick="saveSettings()">Save settings</s-button>
        </s-stack>
      </s-section>

    </s-page>
  </form>

  <script src="/js/app.js"></script>
  <script src="/js/pages/settings.js"></script>
</body>
</html>
