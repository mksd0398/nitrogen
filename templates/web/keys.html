<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API keys - {{APP_NAME}}</title>
  <link rel="stylesheet" href="/css/app.css">
  <meta name="shopify-api-key" content="{{API_KEY}}">
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
</head>
<body>
  <s-app-nav>
    <s-link href="/" rel="home">Dashboard</s-link>
    <s-link href="/products">Products</s-link>
    <s-link href="/settings">Settings</s-link>
    <s-link href="/keys">API keys</s-link>
    <s-link href="/polaris">Components</s-link>
  </s-app-nav>

  <s-page heading="API keys" inlineSize="small">
    <s-link slot="breadcrumb-actions" href="/">Dashboard</s-link>

    <s-section heading="Create a key">
      <s-text color="subdued">
        A key lets a system outside Shopify call the routes that opted in to it.
        It acts as this store and is shown once: copy it when it appears.
      </s-text>
      <s-box paddingBlockStart="base">
        <s-stack gap="base">
          <s-text-field id="key-name" label="Name" placeholder="Mobile app" details="What this key is for, so you can recognise it later."></s-text-field>
          <s-stack direction="inline" gap="base">
            <s-button variant="primary" onclick="createKey()">Create key</s-button>
          </s-stack>
          <div id="key-created"></div>
        </s-stack>
      </s-box>
    </s-section>

    <s-section heading="Your keys">
      <div id="key-list"></div>
    </s-section>
  </s-page>

  <script src="/js/app.js"></script>
  <script src="/js/pages/keys.js"></script>
</body>
</html>
