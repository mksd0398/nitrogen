<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - {{APP_NAME}}</title>
  <link rel="stylesheet" href="/css/app.css">
  <meta name="shopify-api-key" content="{{API_KEY}}">
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="https://cdn.shopify.com/shopifycloud/polaris-1.js"></script>
</head>
<body>
  <s-app-nav>
    <s-link href="/" rel="home">Dashboard</s-link>
    <s-link href="/products">Products</s-link>
    <s-link href="/settings">Settings</s-link>
    <s-link href="/keys">API keys</s-link>
    <s-link href="/polaris">Components</s-link>
    <s-link href="/apis">App Bridge</s-link>
  </s-app-nav>

  <s-page heading="Products">
    <s-link slot="breadcrumb-actions" href="/">Dashboard</s-link>
    <s-button slot="primary-action" onclick="openResourcePicker()">Resource Picker</s-button>

    <!-- Search bar -->
    <s-section>
      <s-search-field
        id="search-input"
        label="Search products"
        placeholder="Search products by title..."
        labelAccessibilityVisibility="exclusive"
       
      ></s-search-field>
    </s-section>

    <!-- Results count — hidden until there is a count, so the card does not
         render as an empty box on load -->
    <s-section id="results-section" style="display:none;">
      <s-text id="results-count" color="subdued"></s-text>
    </s-section>

    <!-- Results container -->
    <s-section>
      <div id="products-container">
        <s-box padding="large-500" border="base" borderRadius="base">
          <s-stack alignItems="center" gap="base">
            <s-heading fontSize="large">Search for products</s-heading>
            <s-text color="subdued">Enter a search term above to find products in your store, or use the Resource Picker to browse.</s-text>
            <s-button variant="primary" onclick="document.getElementById('search-input').focus()">Start searching</s-button>
          </s-stack>
        </s-box>
      </div>
    </s-section>
  </s-page>

  <!-- Product detail modal -->
  <s-modal id="product-detail-modal" heading="Product details" size="large">
    <div id="product-detail-content">
      <s-stack alignItems="center" gap="base">
        <s-spinner></s-spinner>
        <s-text color="subdued">Loading product details...</s-text>
      </s-stack>
    </div>
    <s-button slot="primary-action" variant="primary" commandFor="product-detail-modal" command="--hide">Done</s-button>
  </s-modal>

  <!-- Resource picker result modal -->
  <s-modal id="picker-result-modal" heading="Selected products">
    <div id="picker-result-content">
      <s-text color="subdued">No products selected.</s-text>
    </div>
    <s-button slot="primary-action" variant="primary" commandFor="picker-result-modal" command="--hide">Close</s-button>
  </s-modal>

  <script src="/js/app.js"></script>
  <script src="/js/pages/products.js"></script>
</body>
</html>
