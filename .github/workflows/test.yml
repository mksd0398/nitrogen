name: Test

# Runs on every pull request and on master. The weekly update routine merges
# its own pull request only when this passes (see RELEASING.md).
#
# The templates' tests stub Shopify, so they cannot notice a query that a new
# Shopify API version no longer accepts. check:graphql can: it validates every
# query against the real schema of the version the templates pin.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Scaffolds both templates, installs them, builds and runs their tests
      - name: Test the CLI and the templates
        run: npm run test:e2e

      - name: Check the templates' queries against Shopify's schema
        run: npm run check:graphql
