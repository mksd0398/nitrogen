name: Publish to npm

# Three things start a release:
#
#   - a new version in package.json reaching master, by merging a pull request
#   - pushing a tag:  git tag v2.1.0 && git push origin v2.1.0
#   - running this workflow by hand from the Actions tab, on master
#
# All three are safe to repeat: a version that is already on npm is skipped.
# The first exists for the weekly update routine, which can merge its own pull
# request but cannot push a tag (see RELEASING.md).
#
# Authentication uses npm Trusted Publishing (OIDC). There is no NPM_TOKEN:
# GitHub mints a short-lived identity token per run and npm verifies it came
# from this repo and this workflow file. Nothing long-lived can leak or expire.
#
# This requires a one-time setup on npmjs.com, under the package's
# Settings -> Trusted Publisher:
#   Organization or user : mksd0398
#   Repository           : nitrogen            <- the GitHub repo
#   Package on npm       : @mksd0398/nitrogen
#   Workflow filename    : publish.yml     <- must match THIS file's name
#   Environment          : Production      <- must match `environment:` below
#   Allowed actions      : npm publish
#
on:
  push:
    tags: ["v*"]
    # Path filters are not applied to tags, so a tag always starts a run
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

# One at a time: a merge and a tag for the same version would otherwise both
# find it unpublished and both try to publish it
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Only in the original repo (forks cannot publish), and only from master
    # or a tag: a run started by hand on another branch publishes nothing
    if: github.repository == 'mksd0398/nitrogen' && (github.ref_type == 'tag' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    # Must equal the Environment of the Trusted Publisher on npmjs.com, letter
    # for letter. npm compares it with the identity token GitHub mints, and
    # answers a mismatch with a bare 404.
    environment: Production
    permissions:
      contents: read
      id-token: write # required: lets GitHub mint the OIDC token npm verifies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24, not 22: trusted publishing needs npm >= 11.5.1, and Node 22
      # still ships npm 10.x. Node 24 ships 11.16.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Assert npm is new enough for trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          node -e "
            const [a,b,c] = process.argv[1].split('.').map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error('npm >= 11.5.1 required for trusted publishing'); process.exit(1); }
          " "$NPM_VERSION"

      # The smoke check below actually runs the CLI, which imports `prompts`
      - name: Install dependencies
        run: npm ci

      - name: Sanity check the CLI before publishing
        run: |
          node --check bin/create.js
          node --check lib/index.js
          node --check lib/provision.js
          node --check lib/preflight.js
          node -e "JSON.parse(require('fs').readFileSync('templates/shared/firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.opensource/project.json','utf8'))"
          node bin/create.js --version
          node bin/create.js --help > /dev/null

      # Scaffolds both templates, installs them, builds and runs their tests
      - name: Test the templates
        run: npm run test:e2e

      # The tests stub Shopify. This checks the templates' queries against the
      # real schema of the API version they pin.
      - name: Check the templates' queries against Shopify's schema
        run: npm run check:graphql

      - name: Refuse to ship template build artifacts
        # copyDirSync copies templates verbatim, so a stray node_modules/ or
        # lib/ here would be shipped into every scaffolded project
        run: |
          if find templates -type d \( -name node_modules -o -name lib \) | grep -q .; then
            echo "::error::build artifacts present under templates/ — clean them before publishing"
            find templates -type d \( -name node_modules -o -name lib \)
            exit 1
          fi
          echo "templates are clean"

      - name: Check if this version needs publishing
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @mksd0398/nitrogen@$PACKAGE_VERSION version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $PACKAGE_VERSION already published — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Will publish version $PACKAGE_VERSION"
          fi

      # No NODE_AUTH_TOKEN, and no --provenance flag: trusted publishing
      # authenticates via OIDC and attaches provenance automatically.
      - name: Publish to npm
        id: publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish --access public

      # npm reports a refused trusted publish as a bare 404. The reason is in
      # its debug log: whether it asked GitHub for an identity token, and what
      # the registry answered when that token was exchanged.
      - name: Explain a failed publish
        if: failure() && steps.check.outputs.skip != 'true'
        run: |
          echo "repository: $GITHUB_REPOSITORY"
          echo "workflow:   $GITHUB_WORKFLOW_REF"
          echo "ref:        $GITHUB_REF"
          grep -hiE "oidc|trusted|exchange|http fetch (PUT|POST)" ~/.npm/_logs/*-debug-*.log || echo "npm logged nothing about OIDC"

  # A release that did not start from a tag has none yet, and every version on
  # npm should have one. This is its own job so that the token which can write
  # to the repository is never present while dependencies are installed and run.
  # A tag pushed with this token does not start the workflow again.
  tag:
    needs: publish
    if: needs.publish.outputs.published == 'true' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the published version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v$VERSION"
          # Someone may have pushed the same tag by hand in the meantime
          git push origin "v$VERSION" || git ls-remote --exit-code --tags origin "v$VERSION"
